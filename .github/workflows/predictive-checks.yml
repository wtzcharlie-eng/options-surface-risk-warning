name: Predictive risk checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predictive-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RISK_LLM_PROVIDER: local
      RISK_LLM_API_KEY: ''
      OPENAI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-predictive.lock.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-predictive.lock.txt
      - name: Test predictive causality and grounded assistant
        run: python -m pytest tests/ -q
      - name: Verify competition delivery and legacy runtime
        run: |
          python scripts/build_submission.py --check
          python -W ignore -m drl.tests --underlying
          python -W ignore -m kg.tests
      - name: Verify model and algorithm provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          report = json.loads((root / 'data_out/predictive/report.json').read_text())
          for file, field in [('data_out/predictive/model.json', 'model_sha256'),
                              ('vol_surface/predictive.py', 'algorithm_source_sha256')]:
              assert hashlib.sha256((root / file).read_bytes()).hexdigest() == report[field], file
          report_v2 = json.loads((root / 'data_out/predictive_v2/report.json').read_text())
          assert hashlib.sha256((root / 'data_out/predictive_v2/model.json').read_bytes()).hexdigest() == report_v2['model_sha256']
          for name, expected in report_v2['algorithm_source_sha256'].items():
              assert hashlib.sha256((root / 'vol_surface' / name).read_bytes()).hexdigest() == expected, name
          assert hashlib.sha256((root / 'scripts/train_predictive_v2.py').read_bytes()).hexdigest() == report_v2['training_script_sha256']
          report_v3 = json.loads((root / 'data_out/predictive_v3/report.json').read_text())
          assert hashlib.sha256((root / 'data_out/predictive_v3/model.json').read_bytes()).hexdigest() == report_v3['model_sha256']
          for name, expected in report_v3['algorithm_source_sha256'].items():
              assert hashlib.sha256((root / 'vol_surface' / name).read_bytes()).hexdigest() == expected, name
          assert hashlib.sha256((root / 'scripts/train_predictive_v3.py').read_bytes()).hexdigest() == report_v3['training_script_sha256']
          assert hashlib.sha256((root / 'docs/V3实验设计.md').read_bytes()).hexdigest() == report_v3['design_sha256']
          assert hashlib.sha256((root / 'data_out/predictive_v2/test_predictions.parquet').read_bytes()).hexdigest() == report_v3['comparison_v2']['v2_predictions_sha256']
          print('Frozen V1/V2 and V3 model, source, design and comparison checksums verified')
          PY
      - name: Smoke test interactive dashboard
        run: |
          python scripts/smoke_dashboard.py
          python scripts/smoke_competition.py
          python scripts/smoke_submission.py
      - name: Recompute published V3 scores and final-vintage predictions
        run: python scripts/audit_predictive_v3.py

  submission-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODEL_API_KEY: ''
      MODEL_BASE_URL: ''
      RISK_LLM_PROVIDER: local
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-predictive.lock.txt
      - name: Install browser QA dependencies in a fresh Linux environment
        run: |
          python -m pip install -r requirements-predictive.lock.txt playwright==1.56.0
          python -m playwright install --with-deps chromium
          # SIL-OFL Noto CJK from its official repository, pinned by commit and file hash.
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 2 --max-time 90 -H 'Accept: application/vnd.github.raw+json' 'https://api.github.com/repos/notofonts/noto-cjk/contents/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf?ref=f8d157532fbfaeda587e826d4cd5b21a49186f7c' -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf" | sha256sum --check
          fc-cache -f
      - name: Build the actual amd64 deployment image without credentials
        run: |
          docker build --platform linux/amd64 -t options-risk-submission:2026.10.24 .
          test "$(docker image inspect --format '{{.Architecture}}' options-risk-submission:2026.10.24)" = amd64
          docker run --rm --entrypoint python options-risk-submission:2026.10.24 -c "from pathlib import Path; assert not Path('/app/.env').exists(); print('Image contains no private .env')"
      - name: Start root and prefixed deployments with resource limits
        run: |
          docker run -d --name risk-root --cpus 2 --memory 4g -p 18080:8000 options-risk-submission:2026.10.24
          docker run -d --name risk-prefix --cpus 2 --memory 4g -e SERVICE_PORT=8127 -e SERVICE_BASE_PATH=contest-risk -p 18081:8127 options-risk-submission:2026.10.24
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18080/_stcore/health
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18081/contest-risk/_stcore/health
      - name: Verify browser navigation, chat, download, resources and proxy prefix
        run: python scripts/smoke_submission_browser.py --url http://127.0.0.1:18080/ --prefix-url http://127.0.0.1:18081/contest-risk/ --out-dir /tmp/submission-browser
      - name: Build and verify the public competition archive
        run: |
          python scripts/make_package.py --competition --out /tmp/competition-public.zip
          docker stats --no-stream risk-root risk-prefix
      - name: Save diagnostics and screenshots
        if: always()
        run: |
          mkdir -p /tmp/submission-browser
          docker logs risk-root > /tmp/submission-browser/root-service.log 2>&1 || true
          docker logs risk-prefix > /tmp/submission-browser/prefix-service.log 2>&1 || true
          docker image inspect options-risk-submission:2026.10.24 > /tmp/submission-browser/image.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-submission-browser
          path: /tmp/submission-browser
          retention-days: 7
